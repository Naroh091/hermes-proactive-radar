[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-radar"
version = "0.3.1"
description = "Radar: tasks, checks and proposals that anticipate the owner (Hermes Agent plugin)"
requires-python = ">=3.11"
license = "MIT"
# The Gmail push receiver (radar/ingress/gmail_push_receiver.py) serves with aiohttp and verifies Google's signature
# with cryptography. Floors are the oldest API-compatible releases; upper bounds stop at the next major.
dependencies = ["aiohttp>=3.9,<4", "cryptography>=41,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.entry-points."hermes_agent.plugins"]
hermes-proactive-radar = "radar"

[tool.setuptools.package-data]
radar = ["migrations/*.sql", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["radar", "radar.*"]
